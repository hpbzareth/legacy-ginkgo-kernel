name: Build Legacy Ginkgo 4.14.117 Kernel (Ultra-Optimized)

on:
  workflow_dispatch:
    inputs:
      target_device:
        description: "Target Device (ginkgo: Redmi Note 8 / willow: 8T)"
        required: true
        type: choice
        options:
          - "ginkgo"
        default: "ginkgo"
      clang_version:
        description: "Clang Compiler Toolchain"
        required: true
        type: choice
        options:
          - "proton-clang"
          - "aosp-clang"
        default: "proton-clang"
      release_tag:
        description: "GitHub Release Tag"
        required: false
        type: string
        default: "v1.0-4.14.117-Legacy"
      make_release:
        description: "Publish to GitHub Release"
        required: false
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"

jobs:
  build:
    name: Build Legacy 4.14.117 Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Free Disk Space
        run: |
          echo "=== Freeing runner disk space ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -a -f || true
          df -h

      - name: Checkout Builder Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev lz4 cpio kmod git curl \
            zip unzip file libncurses5-dev libncursesw5-dev python3 python-is-python3 tar wget jq rsync xz-utils perl \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi xxd
          sudo apt-get install -y libtinfo5 || true

      - name: Setup Swap Memory
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Clone Official Xiaomi Kernel Source (Base 4.14.117)
        run: |
          echo "=== Cloning MiCode/Xiaomi_Kernel_OpenSource (branch ginkgo-q-oss) ==="
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git -b ginkgo-q-oss kernel

      - name: Setup Toolchain
        run: |
          mkdir -p toolchain
          CLANG_CHOICE="${{ github.event.inputs.clang_version }}"
          if [ "$CLANG_CHOICE" = "aosp-clang" ]; then
            echo "=== Cloning AOSP Clang ==="
            git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b.git toolchain/clang
          else
            echo "=== Cloning Proton Clang 13 ==="
            git clone --depth=1 https://github.com/kdrag0n/proton-clang.git toolchain/clang
          fi
          # Remove host x86 assembler inside toolchain to prevent accidental execution with arm64 flags
          rm -f toolchain/clang/bin/as || true

      - name: Apply Ultra-Optimizations on 4.14.117 Base
        run: |
          cd kernel
          echo "=== 1. Setting up Localversion ==="
          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Legacy-Ginkgo-Zareth"/' arch/arm64/configs/vendor/ginkgo-perf_defconfig
          echo "CONFIG_LOCALVERSION_AUTO=n" >> arch/arm64/configs/vendor/ginkgo-perf_defconfig

          echo "=== 2. CPU Schedutil 500us & Timer 300Hz Frame-Perfect ==="
          sed -i 's/CONFIG_HZ_100=y/# CONFIG_HZ_100 is not set/' arch/arm64/configs/vendor/ginkgo-perf_defconfig
          sed -i 's/CONFIG_HZ_250=y/# CONFIG_HZ_250 is not set/' arch/arm64/configs/vendor/ginkgo-perf_defconfig
          echo "CONFIG_HZ_300=y" >> arch/arm64/configs/vendor/ginkgo-perf_defconfig
          echo "CONFIG_HZ=300" >> arch/arm64/configs/vendor/ginkgo-perf_defconfig

          echo "=== 3. Storage I/O Scheduler BFQ & Storage Tuning ==="
          echo "CONFIG_IOSCHED_BFQ=y" >> arch/arm64/configs/vendor/ginkgo-perf_defconfig
          echo "CONFIG_DEFAULT_BFQ=y" >> arch/arm64/configs/vendor/ginkgo-perf_defconfig
          echo 'CONFIG_DEFAULT_IOSCHED="bfq"' >> arch/arm64/configs/vendor/ginkgo-perf_defconfig

          echo "=== 4. ZRAM Memory Compression (LZO-RLE) ==="
          echo "CONFIG_CRYPTO_LZO=y" >> arch/arm64/configs/vendor/ginkgo-perf_defconfig
          echo "CONFIG_LZO_COMPRESS=y" >> arch/arm64/configs/vendor/ginkgo-perf_defconfig
          echo "CONFIG_LZO_DECOMPRESS=y" >> arch/arm64/configs/vendor/ginkgo-perf_defconfig
          echo 'CONFIG_ZRAM_DEFAULT_COMP_ALGORITHM="lzo-rle"' >> arch/arm64/configs/vendor/ginkgo-perf_defconfig

          echo "=== 5. Debloat Kernel (Disable Debuggers, Tracing & Overhead) ==="
          sed -i 's/CONFIG_FTRACE=y/CONFIG_FTRACE=n/' arch/arm64/configs/vendor/ginkgo-perf_defconfig
          sed -i 's/CONFIG_DEBUG_KMEMLEAK=y/CONFIG_DEBUG_KMEMLEAK=n/' arch/arm64/configs/vendor/ginkgo-perf_defconfig
          sed -i 's/CONFIG_SLUB_DEBUG=y/CONFIG_SLUB_DEBUG=n/' arch/arm64/configs/vendor/ginkgo-perf_defconfig
          sed -i 's/CONFIG_SCHED_DEBUG=y/CONFIG_SCHED_DEBUG=n/' arch/arm64/configs/vendor/ginkgo-perf_defconfig
          sed -i 's/CONFIG_DEBUG_KERNEL=y/CONFIG_DEBUG_KERNEL=n/' arch/arm64/configs/vendor/ginkgo-perf_defconfig

          echo "=== 6. Pure FolkPatch / APatch Readiness ==="
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/vendor/ginkgo-perf_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/vendor/ginkgo-perf_defconfig
          sed -i 's/CONFIG_MODULE_SIG=y/CONFIG_MODULE_SIG=n/' arch/arm64/configs/vendor/ginkgo-perf_defconfig
          sed -i 's/CONFIG_MODULE_SIG_FORCE=y/# CONFIG_MODULE_SIG_FORCE is not set/' arch/arm64/configs/vendor/ginkgo-perf_defconfig

          echo "=== 7. Appended DTB Image ==="
          echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y" >> arch/arm64/configs/vendor/ginkgo-perf_defconfig

          echo "=== 8. Disable Stack Protector Overhead for Max Execution Speed ==="
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/# CONFIG_CC_STACKPROTECTOR_STRONG is not set/' arch/arm64/configs/vendor/ginkgo-perf_defconfig
          sed -i 's/CONFIG_CC_STACKPROTECTOR_REGULAR=y/# CONFIG_CC_STACKPROTECTOR_REGULAR is not set/' arch/arm64/configs/vendor/ginkgo-perf_defconfig
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/vendor/ginkgo-perf_defconfig

          echo "=== 9. Patch Makefile & DTC for Modern Host / Clang Toolchains ==="
          # Fix dtc yylloc duplicate definition on GCC 10+
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true

          # Correctly append $(CROSS_COMPILE) to --prefix so Clang invokes aarch64-linux-gnu-as
          sed -i 's/CLANG_FLAGS\t+= --prefix=$(GCC_TOOLCHAIN_DIR)/CLANG_FLAGS\t+= --prefix=$(GCC_TOOLCHAIN_DIR)$(CROSS_COMPILE)/g' Makefile

          # Remove forced --gcc-toolchain to avoid warning that trips -Werror during cc-option check
          sed -i 's/CLANG_FLAGS\t+= --gcc-toolchain=$(GCC_TOOLCHAIN)/# CLANG_FLAGS += --gcc-toolchain=$(GCC_TOOLCHAIN)/g' Makefile

          # Ensure compiler stack protector test does not abort make
          sed -i '/not supported by compiler/s/exit 1/true/' Makefile

          # Fix VDSO macro syntax
          sed -i 's/clock_gettime_return, shift=1/clock_gettime_return shift=1/g' arch/arm64/kernel/vdso/gettimeofday.S
          sed -i 's/\.macro clock_gettime_return, shift=0/\.macro clock_gettime_return shift=0/g' arch/arm64/kernel/vdso/gettimeofday.S

          echo "=== Optimizations and Patches Applied Successfully ==="

      - name: Build Kernel Image & DTBs
        run: |
          cd kernel
          export PATH="${{ github.workspace }}/toolchain/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Zareth"
          export KBUILD_BUILD_HOST="HalcyonOS"

          echo "=== Generating Defconfig ==="
          make O=out ARCH=arm64 vendor/ginkgo-perf_defconfig

          echo "=== Compiling Kernel ==="
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCFLAGS="-fcommon -Wno-deprecated-declarations -Wno-error" \
            KCFLAGS="-Wno-error" \
            Image.gz dtbs Image.gz-dtb 2>&1 | tee build.log

          echo "=== Ensuring Image.gz-dtb Exists ==="
          if [ ! -f "out/arch/arm64/boot/Image.gz-dtb" ] && [ -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "Manually concatenating DTBs to Image.gz..."
            cat out/arch/arm64/boot/Image.gz $(find out/arch/arm64/boot/dts -name "*.dtb") > out/arch/arm64/boot/Image.gz-dtb
          fi

          echo "=== Checking Output Artifacts ==="
          ls -la out/arch/arm64/boot/

      - name: Package with AnyKernel3
        id: package
        run: |
          echo "=== Setting up AnyKernel3 ==="
          git clone --depth=1 https://github.com/FlopKernel-Series/AnyKernel3 -b trinket AnyKernel3
          
          TMP_AK3_DIR="${{ github.workspace }}/AnyKernel3"
          mkdir -p "${{ github.workspace }}/output"

          if [ -f "kernel/out/arch/arm64/boot/Image.gz-dtb" ]; then
            cp -f kernel/out/arch/arm64/boot/Image.gz-dtb "$TMP_AK3_DIR/Image.gz-dtb"
          elif [ -f "kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp -f kernel/out/arch/arm64/boot/Image.gz "$TMP_AK3_DIR/Image.gz"
          fi

          if [ -f "kernel/out/arch/arm64/boot/dtbo.img" ]; then
            cp -f kernel/out/arch/arm64/boot/dtbo.img "$TMP_AK3_DIR/dtbo.img"
          fi

          BUILD_DATE=$(date +"%Y%m%d-%H%M")
          FINAL_ZIP_NAME="Legacy-Ginkgo-4.14.117-PurePerf-${BUILD_DATE}.zip"

          echo "=== Injecting Auto-Perf Tuning Service ==="
          printf '%s\n' \
            '#!/system/bin/sh' \
            '# Legacy Ginkgo (4.14.117) Auto-Perf & GPU Turbo Boot Service' \
            'echo 0 > /sys/class/kgsl/kgsl-3d0/max_pwrlevel 2>/dev/null' \
            'echo 3 > /sys/class/kgsl/kgsl-3d0/min_pwrlevel 2>/dev/null' \
            'echo 0 > /sys/class/kgsl/kgsl-3d0/throttling 2>/dev/null' \
            'for pol in /sys/devices/system/cpu/cpufreq/policy*; do' \
            '  echo 500 > $pol/schedutil/up_rate_limit_us 2>/dev/null' \
            '  echo 20000 > $pol/schedutil/down_rate_limit_us 2>/dev/null' \
            'done' \
            'for blk in /sys/block/mmcblk*; do' \
            '  echo bfq > $blk/queue/scheduler 2>/dev/null' \
            '  echo 128 > $blk/queue/read_ahead_kb 2>/dev/null' \
            'done' \
            'echo 5 > /proc/sys/vm/dirty_background_ratio 2>/dev/null' \
            'echo 20 > /proc/sys/vm/dirty_ratio 2>/dev/null' \
            'echo 100 > /proc/sys/vm/vfs_cache_pressure 2>/dev/null' \
            > "$TMP_AK3_DIR/00-legacy-perf.sh"
          chmod 755 "$TMP_AK3_DIR/00-legacy-perf.sh"

          if [ -f "$TMP_AK3_DIR/anykernel.sh" ]; then
            sed -i 's/kernel.string=.*/kernel.string=Legacy Ginkgo Kernel 4.14.117 by Zareth/' "$TMP_AK3_DIR/anykernel.sh"
            sed -i '/write_boot;/a if [ -d /data/adb/service.d ]; then ui_print "  • Installing Legacy Auto-Perf service..."; cp -f $home/00-legacy-perf.sh /data/adb/service.d/00-legacy-perf.sh; chmod 755 /data/adb/service.d/00-legacy-perf.sh; fi' "$TMP_AK3_DIR/anykernel.sh"
          fi

          cd "$TMP_AK3_DIR"
          zip -r -q "${{ github.workspace }}/output/$FINAL_ZIP_NAME" .
          cd "${{ github.workspace }}"

          cd output
          echo "final_zip=$FINAL_ZIP_NAME" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          ls -lh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Legacy-Ginkgo-4.14.117-${{ steps.package.outputs.build_date }}
          path: |
            ${{ github.workspace }}/output/*
            ${{ github.workspace }}/kernel/out/.config

      - name: Publish to GitHub Release
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.make_release != 'false')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINAL_ZIP: ${{ steps.package.outputs.final_zip }}
        run: |
          cd ${{ github.workspace }}/output
          RELEASE_TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v1.0-4.14.117-Legacy"
          fi
          echo "=== Publishing $FINAL_ZIP to Release: $RELEASE_TAG ==="
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Creating new release: $RELEASE_TAG"
            gh release create "$RELEASE_TAG" "$FINAL_ZIP" --repo "$GITHUB_REPOSITORY" --title "Legacy Ginkgo Kernel 4.14.117 (Pure Perf)" --notes "Ultra-optimized official Xiaomi base 4.14.117 kernel for Redmi Note 8 (ginkgo/willow). Clean tree, Adreno 610 GPU Turbo 950MHz L0, Schedutil 500us ramp-up, BFQ MQ, and APatch / FolkPatch ready."
            exit 0
          fi
          gh release upload "$RELEASE_TAG" "$FINAL_ZIP" --repo "$GITHUB_REPOSITORY" --clobber
